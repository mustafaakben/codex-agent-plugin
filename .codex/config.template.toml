# ============================================================================
# Codex CLI Configuration Template for agent-codex
# ============================================================================
# Use this template to bootstrap .codex/config.toml in a target project.
# Active settings are enabled by default; optional settings are commented.
# Copy only the keys you need and adjust values accordingly.
#
# Full reference: https://developers.openai.com/codex/config-reference/
# JSON schema:    https://developers.openai.com/codex/config-schema.json
# ============================================================================

################################################################################
# Core Model Selection
################################################################################

model = "gpt-5.4"
model_reasoning_effort = "xhigh"
# model_reasoning_summary = "auto"           # auto | concise | detailed | none
# model_verbosity = "medium"                 # low | medium | high (Responses API only)
# model_context_window = 1000000             # Context window tokens (gpt-5.4 supports 1M)
# model_auto_compact_token_limit = 900000    # Auto-compact history at this threshold
# personality = "friendly"                   # none | friendly | pragmatic
# service_tier = "fast"                      # flex | fast
# review_model = "gpt-5.4"                  # Separate model for /review

################################################################################
# Execution & Security
################################################################################

sandbox_mode = "workspace-write"             # read-only | workspace-write | danger-full-access
approval_policy = "on-request"               # untrusted | on-request | never
# allow_login_shell = false                  # Disallow login-shell semantics for security
# hide_agent_reasoning = false               # Suppress reasoning output (useful for CI)
# show_raw_agent_reasoning = false           # Surface raw reasoning content

################################################################################
# Web Search
################################################################################

web_search = "live"                          # disabled | cached | live

################################################################################
# Developer Customization
################################################################################

# developer_instructions = ""                # Custom instructions injected into every session
# commit_attribution = ""                    # Custom commit co-author trailer
# file_opener = "vscode"                     # vscode | cursor | windsurf | vscode-insiders | none

################################################################################
# Notifications
################################################################################

# notify = ["notify-send", "Codex"]          # External program for event alerts

################################################################################
# Feature Flags
################################################################################

[features]
# multi_agent = true                         # Multi-agent collaboration
# js_repl = true                             # JavaScript REPL
# fast_mode = true                           # Fast mode toggle
# shell_snapshot = true                      # Shell environment snapshots
# undo = false                               # Undo support
# prevent_idle_sleep = false                 # Prevent sleep during active tasks
# image_generation = false                   # Image generation tool

################################################################################
# Shell Environment Policy
################################################################################

# [shell_environment_policy]
# inherit = "all"                            # all | core | none
# ignore_default_excludes = false            # Keep SECRET/TOKEN auto-filter
# exclude = []                               # Glob patterns to remove (e.g. ["AWS_*"])
# include_only = []                          # Whitelist (e.g. ["PATH", "HOME"])
# set = {}                                   # Explicit overrides (e.g. { EDITOR = "vim" })

################################################################################
# Sandbox Fine-Tuning
################################################################################

# [sandbox_workspace_write]
# writable_roots = []                        # Additional writable directories
# network_access = false                     # Allow outbound network
# exclude_tmpdir_env_var = false             # Exclude $TMPDIR from writable
# exclude_slash_tmp = false                  # Exclude /tmp from writable

################################################################################
# History
################################################################################

# [history]
# persistence = "save-all"                   # save-all | none
# max_bytes = 104857600                      # Cap at 100 MiB, drop oldest entries

################################################################################
